<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 640px;
      padding: 48px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 18px 50px #0f172a1a;
    }

    .tag {
      color: #0369a1;
      font-weight: 700;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: -.05em;
    }

    p {
      color: #475569;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 650;
    }
  </style>
</head>

<body>
  <main>
    <span class="tag">A tiny container-ready site</span>
    <h1>Hello, Docker.</h1>
    <p>This page is served with Nginx. Build the image from the Dockerfile in this folder, then run it to see this site
      in your browser.</p>
    <a href="https://docs.docker.com/" target="_blank" rel="noopener noreferrer">Explore Docker</a>
  </main>
</body>

</html>
